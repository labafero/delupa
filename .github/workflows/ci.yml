name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Start admin app for browser tests
        run: |
          NUXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54331 \
            NUXT_PUBLIC_SUPABASE_KEY=test-anon-key \
            pnpm --filter @delupa/admin exec nuxt dev --port 3001 --host 0.0.0.0 --dotenv false \
            > /tmp/delupa-admin.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3001/login > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/delupa-admin.log
          exit 1
      - name: End-to-end tests
        run: pnpm test:e2e
      - name: Lint
        run: pnpm lint
      - name: Formatting
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
